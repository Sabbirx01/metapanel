<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Developer X — Download</title>
<style>
  :root{--bg:#0a0d1a;--card:#141a2e;--line:#273048;--tx:#eaeefb;--mu:#98a3c2;--acc:#8b6bff;--ok:#22c55e;--bad:#f87171;--warn:#fbbf24}
  *{box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 50% -10%,#1b1f3d 0%,var(--bg) 60%);
       color:var(--tx);display:flex;align-items:center;justify-content:center;padding:20px}
  .wrap{width:100%;max-width:520px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;
        box-shadow:0 24px 60px rgba(0,0,0,.45)}
  h1{font-size:21px;margin:0 0 4px;letter-spacing:.2px}
  .sub{color:var(--mu);font-size:13px;margin:0 0 18px}
  label{display:block;font-size:12px;color:var(--mu);margin:0 0 6px;font-weight:600}
  input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
        background:#101527;color:var(--tx);font-size:15px;outline:none}
  input:focus{border-color:var(--acc)}
  button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;font-size:15px;font-weight:800;
         color:#fff;background:linear-gradient(180deg,#7d5cff,#6d4aff);cursor:pointer}
  button:hover{background:linear-gradient(180deg,#8a6bff,#7a5cff)}
  button:disabled{background:#262c44;color:#7b7896;cursor:not-allowed}
  .box{margin-top:16px;padding:14px;border-radius:12px;font-size:13.5px;line-height:1.55;display:none}
  .box.show{display:block}
  .info{background:#181b36;border:1px solid #343a70}
  .good{background:#0f2e20;border:1px solid #1f6b45;color:#c9f7dd}
  .bad{background:#33161a;border:1px solid #7f2b32;color:#ffd4d4}
  .warn{background:#302410;border:1px solid #7a5a1c;color:#ffe6b3}
  a{color:#c3b2ff}
  .meta{color:var(--mu);font-size:12px;margin-top:10px}
  .row{display:flex;gap:10px}
  .row button{margin-top:0}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #273048}
  .kv:last-child{border-bottom:0}
  code{background:#0f1425;padding:2px 6px;border-radius:6px;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Developer X — Panel Download</h1>
    <p class="sub">আপনার key দিয়ে লগইন করুন · sign in with the key you were given</p>

    <label for="k">Licence Key</label>
    <input id="k" placeholder="আপনার key এখানে" autocomplete="off" spellcheck="false">
    <button id="go">🔓 লগইন / Login</button>

    <div id="msg" class="box"></div>

    <div id="dl" class="box good">
      <div style="font-weight:800;margin-bottom:8px">✅ অনুমতি পাওয়া গেছে · approved</div>
      <div class="kv"><span>Version</span><span id="d-ver">—</span></div>
      <div class="kv"><span>File</span><span id="d-file">—</span></div>
      <div class="kv"><span>Size</span><span id="d-size">—</span></div>
      <div class="kv"><span>SHA-256</span><span id="d-sha" style="font-size:11px">—</span></div>
      <button id="dlbtn" style="margin-top:14px">⬇️ Download</button>
      <div class="meta">GitHub থেকেই নামবে — signature-যাচাই করা একই ফাইল যা auto-update-ও ব্যবহার করে।</div>
    </div>

    <div id="bad" class="box bad">
      <div style="font-weight:800">❌ এই key টা দিয়ে download হবে না · not allowed</div>
      <div id="b-why" class="meta"></div>
      <button id="req" style="margin-top:12px;background:linear-gradient(180deg,#3ddc6f,#22c55e)">
        📩 WhatsApp-এ অনুমতি চাই
      </button>
    </div>

  </div>
</div>

<script>
// ── config ────────────────────────────────────────────────────────────────────────────────────
// 🔑 THE OLD KEY LIST IS GONE (2026-10-13). This page used to carry, inside this very <script>, a
// public list of SHA-256 hashes PLUS a hard-coded master key. Two consequences, both bad:
//   1. a key issued in the admin panel did NOT open the download until somebody had also added its
//      hash to that list by hand with ADMIN.bat — the owner: *"er jonno alada key lagbe na"*;
//   2. the page is static, so anyone could read the master key straight out of the source and
//      download for free, with no key at all.
// Now the ONLY thing that decides is the licence server, and it reads the same table the admin panel
// writes to. Issue a key -> it downloads. Block the key -> it stops downloading. There is no second
// list anywhere, so the two can never drift apart again.
const CFG = {
  api: "/metapanel/release.json",                                   // version / file / sha256
  licenseApi: "https://license.automationservice.online/api/download.php",
  whatsapp: "8801410014442",     // admin-এর WhatsApp (international, country code সহ)
};
const $ = id => document.getElementById(id);
const show = (el, on) => el.classList.toggle("show", on);

async function getJSON(name) {
  const r = await fetch(name + "?v=" + Date.now(), {cache: "no-store"});
  if (!r.ok) throw new Error(name + " — HTTP " + r.status);
  return r.json();
}

function say(kind, html) {
  const el = $("msg");
  el.className = "box show " + kind;
  el.innerHTML = html;
}

// ── does the licence server know this key? ────────────────────────────────────────────────────
// ⚠️ THE ONE ANSWER THIS PAGE TRUSTS. It is a cross-origin POST, and the endpoint answers the
// browser's preflight itself (OPTIONS 204 + Access-Control-Allow-Origin), so nothing else is needed
// here. An unreachable server is reported as exactly that — never as "key not recognised", because
// telling a paying customer his key is bad when the network is down is how a support thread starts.
async function ask(key) {
  const r = await fetch(CFG.licenseApi, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({license_key: key}),
    cache: "no-store",
  });
  const text = await r.text();
  let data;
  try { data = JSON.parse(text); }
  catch (e) { throw new Error("server answered " + r.status + " — " + text.slice(0, 120)); }
  if (r.status >= 400) { throw new Error("server answered HTTP " + r.status); }
  return data;
}

async function check() {
  const typed = $("k").value.trim();
  show($("dl"), false); show($("bad"), false); show($("msg"), false);
  if (typed.length < 4) { say("warn", "key টা পুরো লিখুন · enter your full key"); return; }

  $("go").disabled = true;
  $("go").textContent = "⏳ দেখা হচ্ছে…";
  try {
    const [verdict, rel] = await Promise.all([
      ask(typed),
      getJSON(CFG.api).catch(() => null),
    ]);

    if (!verdict.valid) {
      // The server owns the wording, so a blocked key, an expired key and a typo all explain
      // themselves in the customer's own language.
      $("b-why").textContent = verdict.message || "";
      show($("bad"), true);
      return;
    }
    if (!rel) {
      say("warn", "আপনার key ঠিক আছে ✅ — কিন্তু build-এর তথ্য লোড করা গেল না। "
                + "একবার আবার চেষ্টা করুন।");
      return;
    }

    show($("dl"), true);
    $("d-ver").textContent  = rel.version || "—";
    $("d-file").textContent = rel.asset || "—";
    $("d-size").textContent = rel.size_mb ? rel.size_mb + " MB" : "—";
    $("d-sha").textContent  = (rel.sha256 || "—").slice(0, 24) + "…";
    $("dlbtn").onclick = () => { window.location.href = rel.url; };

    const bits = [];
    if (verdict.customer) bits.push("স্বাগতম, <b>" + verdict.customer + "</b>");
    else bits.push("🔑 key ঠিক আছে");
    if (verdict.plan) bits.push("plan: " + verdict.plan);
    if (verdict.days_remaining !== undefined && verdict.days_remaining !== 9999)
      bits.push("বাকি " + verdict.days_remaining + " দিন");
    else if (verdict.license_type === "lifetime") bits.push("lifetime");
    say("good", bits.join(" · ") + " — নিচের Download বাটন চাপুন ⬇️");
  } catch (e) {
    say("info", "licence server-এ পৌঁছানো গেল না · could not reach the licence server<br>"
              + "<code>" + e.message + "</code><br>ইন্টারনেট চেক করে আবার চাপুন।");
  } finally {
    $("go").disabled = false;
    $("go").textContent = "🔓 লগইন / Login";
  }
}

function request() {
  // 📱 WHATSAPP (customer, 2026-10-11 16:0x). A GitHub issue needed a GitHub account and a manual copy
  // of the hash; WhatsApp is one tap and the key is already in the message.
  const typed = $("k").value.trim();
  const msg = "আসসালামু আলাইকুম — আমি Developer X প্যানেলের download access চাই।\n\n" +
              "আমার key: " + (typed || "(লিখিনি)") + "\n\n" +
              "(এই key টা admin panel-এ issue করলে আমি download করতে পারব)";
  window.open("https://wa.me/" + CFG.whatsapp + "?text=" + encodeURIComponent(msg), "_blank");
}

$("go").onclick = check;
$("k").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
$("req").onclick = request;
</script>
</body>
</html>
